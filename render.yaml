services:
  - type: web
    name: mylituk-api
    env: python
    region: oregon
    plan: free
    branch: claude/add-event-award-alerts-011CUSghoXR5QUSyqLWKyYKA
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./mylituk.db
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://mylituk.netlify.app,http://localhost:3000
      - key: PYTHON_VERSION
        value: 3.11.0
